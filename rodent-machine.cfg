# BTT Rodent V1.1 + Klipper — 4-axis cartesian machine config
#
# Every pin here is VERIFIED on hardware: each port was driven individually and
# confirmed both electrically (TMC open-load) and by watching the motor turn.
#
# ---------------------------------------------------------------------------
# ENDSTOPS
# Klipper makes endstop_pin MANDATORY for a cartesian rail (klippy/stepper.py:336
# does config.get('endstop_pin') with no default) - it cannot be omitted. So they
# are declared on the board's real limit inputs, which are simply not wired.
# Nothing homes: [force_move] is enabled and you establish position with
#     SET_KINEMATIC_POSITION X=0 Y=0 Z=0
# instead of G28. Soft limits are off so moves are not range-checked.
#
# When you DO wire endstops: GPIO32-39 are INPUT-ONLY on the ESP32 and have NO
# internal pull resistors - the port's gpio_in_reset() calls gpio_pullup_en() and
# silently ignores the failure. External pull-ups are required; a bare '^' prefix
# will not do anything.
# ---------------------------------------------------------------------------
#
# FIRMWARE this config expects (menuconfig):
#   Espressif ESP32 / esp32 / shift register ON
#   SR_BYTE_NO=2  DATA=21  CLK=22  LATCH=17  SR_CLOCK_FREQ_MHZ=40
#   UART0 TX=1 RX=3, SERIAL_BAUD 250000, HAVE_STEPPER_OPTIMIZED_BOTH_EDGE=y
#
# MEASURED: coordinated motion is 0.0% retransmits at 50 mm/s and 1.8% at
# 100 mm/s; it degrades past ~200 mm/s. max_velocity below is set accordingly.

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000

[printer]
kinematics: cartesian
max_velocity: 150            # measured clean well past this; 300 is not clean
max_accel: 3000
max_z_velocity: 50
max_z_accel: 500

[force_move]
enable_force_move: True      # allows SET_KINEMATIC_POSITION instead of homing

# ===========================================================================
#  Axes.  rotation_distance below is a PLACEHOLDER (40 = a 20T GT2 pulley).
#  Set it from your actual mechanics: leadscrew pitch, or pulley teeth x belt
#  pitch. Everything else is verified board wiring and should not need changing.
# ===========================================================================

[stepper_x]
step_pin: SR2
dir_pin: SR1
enable_pin: !SR0
microsteps: 16
rotation_distance: 40
endstop_pin: GPIO35          # declared, NOT wired - see header
position_endstop: 0
homing_positive_dir: False   # never homed; stated explicitly so Klipper need not infer it
position_min: -10000         # effectively unlimited: nothing is homed
position_max: 10000
homing_speed: 20

[tmc5160 stepper_x]
cs_pin: GPIO5
spi_software_sclk_pin: GPIO18
spi_software_mosi_pin: GPIO23
spi_software_miso_pin: GPIO19
chain_length: 4
chain_position: 1
run_current: 0.8             # 2.5A motors run cold here; raise deliberately
sense_resistor: 0.075        # V1.1 = R075. BTT's published yaml says 0.022 - WRONG for V1.1

[stepper_y]
step_pin: SR5
dir_pin: SR4
enable_pin: !SR7
microsteps: 16
rotation_distance: 40
endstop_pin: GPIO34
position_endstop: 0
homing_positive_dir: False   # never homed; stated explicitly so Klipper need not infer it
position_min: -10000
position_max: 10000
homing_speed: 20

[tmc5160 stepper_y]
cs_pin: GPIO5                # same physical CS - chain looked up via the shared pin
chain_length: 4
chain_position: 2
run_current: 0.8
sense_resistor: 0.075

[stepper_z]
step_pin: SR10
dir_pin: SR9
enable_pin: !SR8
microsteps: 16
rotation_distance: 40        # set to your leadscrew pitch (e.g. 8 for TR8*8)
endstop_pin: GPIO33
position_endstop: 0
homing_positive_dir: False   # never homed; stated explicitly so Klipper need not infer it
position_min: -10000
position_max: 10000
homing_speed: 10

[tmc5160 stepper_z]
cs_pin: GPIO5
chain_length: 4
chain_position: 3
run_current: 0.8
sense_resistor: 0.075

# 4th axis on the E0 slot. Cartesian kinematics only knows X/Y/Z, so this is a
# manual_stepper - drive it with MANUAL_STEPPER STEPPER=a MOVE=... It can become
# a real rotary/dual-gantry axis later ([stepper_a] via dual_carriage, etc).
[manual_stepper a]
step_pin: SR13
dir_pin: SR12
enable_pin: !SR15
microsteps: 16
rotation_distance: 40
velocity: 50
accel: 500

[tmc5160 manual_stepper a]
cs_pin: GPIO5
chain_length: 4
chain_position: 4
run_current: 0.8
sense_resistor: 0.075

# ---------------------------------------------------------------------------
# Not configured, and why:
#   * Spindle: the Huanyang VFD on UART1 (gpio 15/16/14) speaks Modbus and
#     Klipper has NO Modbus support. This is a real regression vs FluidNC. An
#     [output_pin] driving the VFD's 0-10V analog input is the usual workaround.
#   * OLED / I2C (gpio 27/26): HAVE_GPIO_I2C is still commented out in the
#     port's Kconfig.
#   * SD card (CS gpio.0): unused, Klipper streams gcode from the host.
#   * Status LEDs SR3 / SR11 / SR14 are addressable but digital-only -
#     shift-register pins cannot do hardware PWM (fermino issue #39).
# ---------------------------------------------------------------------------
