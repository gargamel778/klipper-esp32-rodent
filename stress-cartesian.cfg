# Real coordinated-motion test: cartesian kinematics driving 3 steppers from a
# single move queue, which is how an actual machine runs. The manual_stepper
# tests issue 4 independent move streams plus an M400 barrier - a pattern no
# real Klipper machine produces - so this checks whether the retransmits are a
# genuine port problem or an artifact of that harness.
#
# force_move lets us SET_KINEMATIC_POSITION instead of homing (no endstops wired).

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000

[printer]
kinematics: cartesian
max_velocity: 400
max_accel: 5000
max_z_velocity: 100
max_z_accel: 1000

[force_move]
enable_force_move: True

[stepper_x]
step_pin: GPIO4
dir_pin: GPIO2
microsteps: 16
rotation_distance: 40
endstop_pin: GPIO34
position_endstop: 0
position_max: 300
homing_speed: 20

[stepper_y]
step_pin: GPIO13
dir_pin: GPIO14
microsteps: 16
rotation_distance: 40
endstop_pin: GPIO35
position_endstop: 0
position_max: 300
homing_speed: 20

[stepper_z]
step_pin: GPIO16
dir_pin: GPIO15
microsteps: 16
rotation_distance: 8
endstop_pin: GPIO33
position_endstop: 0
position_max: 100
homing_speed: 10
