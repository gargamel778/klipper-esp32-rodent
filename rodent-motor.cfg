# BTT Rodent V1.1 - first real motor test.
#
# This is the REAL wiring at last: step/dir/enable go through the 74HC595 chain
# (SRn), and all four TMC5160s are addressed over the shared-CS daisy chain.
#
# manual_stepper (kinematics: none) is used deliberately - it gives explicit
# per-axis control with no homing, which is exactly what is needed to identify
# which chain_position drives which physical port.
#
# run_current 0.8A into a 2.5A motor: intentionally conservative for a first run.

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000

[printer]
kinematics: none
max_velocity: 200
max_accel: 2000

# ---- steppers, all via the shift register ----
[manual_stepper sx]
step_pin: SR2
dir_pin: SR1
enable_pin: !SR0
microsteps: 16
rotation_distance: 40
velocity: 50
accel: 500

[manual_stepper sy]
step_pin: SR5
dir_pin: SR4
enable_pin: !SR7
microsteps: 16
rotation_distance: 40
velocity: 50
accel: 500

[manual_stepper sz]
step_pin: SR10
dir_pin: SR9
enable_pin: !SR8
microsteps: 16
rotation_distance: 8
velocity: 25
accel: 250

[manual_stepper sa]
step_pin: SR13
dir_pin: SR12
enable_pin: !SR15
microsteps: 16
rotation_distance: 40
velocity: 50
accel: 500

# ---- TMC5160 daisy chain: only the FIRST section declares the SPI pins ----
[tmc5160 manual_stepper sx]
cs_pin: GPIO5
spi_software_sclk_pin: GPIO18
spi_software_mosi_pin: GPIO23
spi_software_miso_pin: GPIO19
chain_length: 4
chain_position: 1
run_current: 0.8
sense_resistor: 0.075

[tmc5160 manual_stepper sy]
cs_pin: GPIO5
chain_length: 4
chain_position: 2
run_current: 0.8
sense_resistor: 0.075

[tmc5160 manual_stepper sz]
cs_pin: GPIO5
chain_length: 4
chain_position: 3
run_current: 0.8
sense_resistor: 0.075

[tmc5160 manual_stepper sa]
cs_pin: GPIO5
chain_length: 4
chain_position: 4
run_current: 0.8
sense_resistor: 0.075
