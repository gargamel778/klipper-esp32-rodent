# BTT Rodent V1.1 — CoreXY 3D-printer simulation config.
#
# Uses REAL corexy kinematics so the motor duty cycle is authentic:
#   pure X move  -> A and B both step, same direction
#   pure Y move  -> A and B both step, opposite directions
#   45 deg move  -> ONE motor steps, the other is still
# So perimeters (axis-aligned) load both motors and diagonal infill loads them
# individually - exactly the alternating pattern a real printer produces, without
# having to fake it.
#
# rotation_distance values are printer-realistic rather than the 40 used for the
# motor-identification tests, so the step rates match a real machine:
#   X/Y  40  = 20T GT2 pulley
#   Z     8  = TR8x8 leadscrew  (z-hops therefore cost 8x the steps of an XY mm)
#   E   7.7  = Bondtech-style geared extruder
#
# The 4th driver stands in for the extruder. It cannot be a real [extruder]
# section: Klipper requires a heater + temperature sensor there, and with no
# thermistor fitted the ADC would read out of range and shut down. manual_stepper
# with SYNC=0 gives the same MCU-side concurrency (4 steppers stepping at once)
# which is what is actually under test.

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 50000
max_z_velocity: 100
max_z_accel: 2000

[force_move]
enable_force_move: True

# --- CoreXY A motor ---
[stepper_x]
step_pin: SR2
dir_pin: SR1
enable_pin: !SR0
microsteps: 16
rotation_distance: 40
endstop_pin: GPIO35
position_endstop: 0
homing_positive_dir: False
position_min: -1000
position_max: 1000
homing_speed: 20

[tmc5160 stepper_x]
cs_pin: GPIO5
spi_software_sclk_pin: GPIO18
spi_software_mosi_pin: GPIO23
spi_software_miso_pin: GPIO19
chain_length: 4
chain_position: 1
run_current: 0.8
sense_resistor: 0.075

# --- CoreXY B motor ---
[stepper_y]
step_pin: SR5
dir_pin: SR4
enable_pin: !SR7
microsteps: 16
rotation_distance: 40
endstop_pin: GPIO34
position_endstop: 0
homing_positive_dir: False
position_min: -1000
position_max: 1000
homing_speed: 20

[tmc5160 stepper_y]
cs_pin: GPIO5
chain_length: 4
chain_position: 2
run_current: 0.8
sense_resistor: 0.075

# --- Z (leadscrew) ---
[stepper_z]
step_pin: SR10
dir_pin: SR9
enable_pin: !SR8
microsteps: 16
rotation_distance: 8
endstop_pin: GPIO33
position_endstop: 0
homing_positive_dir: False
position_min: -1000
position_max: 1000
homing_speed: 10

[tmc5160 stepper_z]
cs_pin: GPIO5
chain_length: 4
chain_position: 3
run_current: 0.8
sense_resistor: 0.075

# --- E: a REAL [extruder], so E is part of the coordinated move queue and gets
#     pressure advance, exactly like a printer. Klipper mandates a heater and a
#     temperature sensor here, and no thermistor is fitted - so:
#
#  * a custom adc_temperature table maps the WHOLE ADC span to 0-500C, so
#    whatever the floating pin reads is always in range and never faults.
#  * min_temp: 0 is required because heaters.py bounds min_extrude_temp with
#    minval=min_temp.
#  * min_extrude_temp: 0 makes heaters.py set can_extrude=True unconditionally
#    (heaters.py:39), so extrusion is permitted with no heater at all.
#  * no target temperature is ever commanded, so verify_heater stays quiet
#    (verify_heater.py:49 resets its checks whenever target <= 0).
#
# heater_pin drives an otherwise-unused GPIO with nothing connected to it.

[adc_temperature dummy_thermistor]
temperature1: 0
voltage1: 0.0
temperature2: 500
voltage2: 3.3

[extruder]
step_pin: SR13
dir_pin: SR12
enable_pin: !SR15
microsteps: 16
rotation_distance: 7.7
nozzle_diameter: 0.4
filament_diameter: 1.75
pressure_advance: 0.04
pressure_advance_smooth_time: 0.03
heater_pin: GPIO2
sensor_type: dummy_thermistor
sensor_pin: GPIO36
control: watermark
min_temp: 0
max_temp: 500
min_extrude_temp: 0
max_extrude_only_distance: 500
max_extrude_cross_section: 999

[tmc5160 extruder]
cs_pin: GPIO5
chain_length: 4
chain_position: 4
run_current: 0.8
sense_resistor: 0.075
