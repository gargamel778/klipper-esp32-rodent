# Study config: identical wiring to rodent-machine.cfg but with the velocity and
# acceleration ceilings raised out of the way, so the ramp can be driven entirely
# by SET_VELOCITY_LIMIT at runtime rather than by reloading config per phase.
#
# The limits below are deliberately absurd. They are NOT a recommendation - the
# study exists to find where reality stops, and the config must not be what stops it.

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000

[printer]
kinematics: cartesian
max_velocity: 2000
max_accel: 100000
max_z_velocity: 2000
max_z_accel: 100000

[force_move]
enable_force_move: True

[stepper_x]
step_pin: SR2
dir_pin: SR1
enable_pin: !SR0
microsteps: 16
rotation_distance: 40
endstop_pin: GPIO35
position_endstop: 0
homing_positive_dir: False
position_min: -100000
position_max: 100000
homing_speed: 20

[tmc5160 stepper_x]
cs_pin: GPIO5
spi_software_sclk_pin: GPIO18
spi_software_mosi_pin: GPIO23
spi_software_miso_pin: GPIO19
chain_length: 4
chain_position: 1
run_current: 0.8
sense_resistor: 0.075

[stepper_y]
step_pin: SR5
dir_pin: SR4
enable_pin: !SR7
microsteps: 16
rotation_distance: 40
endstop_pin: GPIO34
position_endstop: 0
homing_positive_dir: False
position_min: -100000
position_max: 100000
homing_speed: 20

[tmc5160 stepper_y]
cs_pin: GPIO5
chain_length: 4
chain_position: 2
run_current: 0.8
sense_resistor: 0.075

[stepper_z]
step_pin: SR10
dir_pin: SR9
enable_pin: !SR8
microsteps: 16
rotation_distance: 40
endstop_pin: GPIO33
position_endstop: 0
homing_positive_dir: False
position_min: -100000
position_max: 100000
homing_speed: 10

[tmc5160 stepper_z]
cs_pin: GPIO5
chain_length: 4
chain_position: 3
run_current: 0.8
sense_resistor: 0.075

[manual_stepper a]
step_pin: SR13
dir_pin: SR12
enable_pin: !SR15
microsteps: 16
rotation_distance: 40
velocity: 200
accel: 5000

[tmc5160 manual_stepper a]
cs_pin: GPIO5
chain_length: 4
chain_position: 4
run_current: 0.8
sense_resistor: 0.075
