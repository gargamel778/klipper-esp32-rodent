# Stress-test config for the BTT Rodent V1.1 running Klipper.
#
# kinematics: none deliberately - no endstops are wired, and GPIO34/35 are
# input-only pins with NO internal pull resistors on the ESP32 (the port's
# gpio_in_reset() calls gpio_pullup_en() and ignores the error), so a homing
# config would be meaningless here. manual_stepper gives full stepper exercise
# without any of that.
#
# All four drivers are addressed through the shared-CS daisy chain.

[mcu]
serial: /dev/cu.wchusbserial10
baud: 250000

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

# ---- four steppers, all through the 74HC595 chain ----
[manual_stepper sx]
step_pin: GPIO4
dir_pin: GPIO2
#no enable pin
microsteps: 16
rotation_distance: 40
velocity: 200
accel: 3000

[manual_stepper sy]
step_pin: GPIO13
dir_pin: GPIO14
#no enable pin
microsteps: 16
rotation_distance: 40
velocity: 200
accel: 3000

[manual_stepper sz]
step_pin: GPIO16
dir_pin: GPIO15
#no enable pin
microsteps: 16
rotation_distance: 8
velocity: 100
accel: 1000

[manual_stepper sa]
step_pin: GPIO27
dir_pin: GPIO26
#no enable pin
microsteps: 16
rotation_distance: 40
velocity: 200
accel: 3000

# ---- TMC5160 daisy chain: one shared CS, chain_position == spi_index ----
[tmc5160 manual_stepper sx]
cs_pin: GPIO5
spi_software_sclk_pin: GPIO18
spi_software_mosi_pin: GPIO23
spi_software_miso_pin: GPIO19
chain_length: 4
chain_position: 1
run_current: 0.8
sense_resistor: 0.075

[tmc5160 manual_stepper sy]
cs_pin: GPIO5                 # same pin - chain is looked up via the shared CS
chain_length: 4
chain_position: 2
run_current: 0.8
sense_resistor: 0.075

[tmc5160 manual_stepper sz]
cs_pin: GPIO5                 # same pin - chain is looked up via the shared CS
chain_length: 4
chain_position: 3
run_current: 0.8
sense_resistor: 0.075

[tmc5160 manual_stepper sa]
cs_pin: GPIO5                 # same pin - chain is looked up via the shared CS
chain_length: 4
chain_position: 4
run_current: 0.8
sense_resistor: 0.075
